# saath-api configuration skeleton
# All values here are overridable via environment variables using the
# SAATH__ prefix (double underscore as nested separator).
# Example: SAATH__LLM__TIMEOUT_S=5.0 overrides llm.timeout_s

# ---------------------------------------------------------------------------
# API / server
# ---------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  p99_latency_ms: 2000          # SLO: 99th-percentile response latency ceiling
  request_timeout_s: 10.0       # Overall request timeout guard

# ---------------------------------------------------------------------------
# LLM gateway
# ---------------------------------------------------------------------------
llm:
  provider: "fake"              # "fake" | "openai" | "anthropic" | "google"
  model: "gpt-4o-mini"         # Model name forwarded to the provider
  timeout_s: 8.0               # Per-request LLM timeout; triggers fallback
  budget_usd: 0.01             # Per-request USD cost cap; triggers fallback
  max_tokens: 512              # Max completion tokens
  temperature: 0.7             # Sampling temperature
  prices:                      # USD per 1 k tokens (for cost tracking)
    gpt-4o-mini:
      input: 0.000150
      output: 0.000600
    gpt-4o:
      input: 0.005000
      output: 0.015000

# ---------------------------------------------------------------------------
# Slot verification
# ---------------------------------------------------------------------------
verifier:
  strict: true                 # If true, missing slots cause fallback; else silently skip

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
cache:
  backend: "memory"            # "memory" | "redis"
  redis_url: "redis://localhost:6379/0"
  ttl_s: 300                   # Default cache TTL in seconds
  max_memory_items: 1000       # Only used for in-memory backend

# ---------------------------------------------------------------------------
# Match feed adapter
# ---------------------------------------------------------------------------
match_feed:
  backend: "fake"              # "fake" | "http"
  base_url: "https://api.example.com/v1"
  timeout_s: 3.0
  api_key: ""                  # Overridden by SAATH__MATCH_FEED__API_KEY

# ---------------------------------------------------------------------------
# User context adapter
# ---------------------------------------------------------------------------
user_context:
  backend: "fake"              # "fake" | "http"
  base_url: "https://users.example.com/v1"
  timeout_s: 2.0

# ---------------------------------------------------------------------------
# Engine / pipeline
# ---------------------------------------------------------------------------
engine:
  fallback_template_path: "app/engine/templates/fallback.yaml"
  max_retry_attempts: 1        # LLM retries before falling back
  winprob_model_path: "app/engine/models/winprob_v1.joblib"
  moment_weights:
    swing: 0.40
    wicket: 0.20
    six: 0.12
    four: 0.06
    fifty: 0.10
    hundred: 0.15
    partnership_milestone: 0.08
    three_wickets_in_three_overs: 0.12
    hat_trick_ball: 0.15
    tight_finish: 0.12

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "json"               # "json" | "console" (console for local dev)
  render_json_logs: true
